apiVersion: kafka.strimzi.io/v1
kind: Kafka

metadata:
  name: lab-cluster
  namespace: kafka
  annotations: 
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled

spec:
  kafka:
    version: 4.1.0

    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false

  entityOperator:
    topicOperator: {}
    userOperator: {}